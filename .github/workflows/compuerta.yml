name: Compuerta CI

# NOTA DE ARQUITECTURA (Build en CI):
# Todas las rutas de la aplicación se compilan como dinámicas (ƒ) y la única estática es /_not-found (○).
# Gracias a esto, el step de build de Next.js pasa limpiamente en CI aún con variables simuladas,
# ya que ninguna página se prerenderiza en build-time intentando consultar la base de datos real.
# ADVERTENCIA: El día que alguien intente prerenderizar estáticamente una página que lea de la BD,
# esta compuerta fallará de inmediato en CI. Eso es una alarma deliberada de diseño, no un fallo espurio.

on:
  push:
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Verificación de Calidad
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_pwd
          POSTGRES_DB: finanzas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres_dev_pwd@localhost:5432/finanzas_db
      NEXTAUTH_SECRET: ci-secret-token-compuerta-1234567890
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificación de tipos TypeScript
        if: ${{ !cancelled() }}
        run: pnpm exec tsc --noEmit

      - name: Verificación de linter ESLint
        if: ${{ !cancelled() }}
        run: pnpm exec eslint . --max-warnings 0

      - name: Ejecutar suite de pruebas unitarias
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Compilación de producción (Next.js build)
        if: ${{ !cancelled() }}
        env:
          NEXTAUTH_SECRET: ci-secret-token-compuerta-1234567890
          DATABASE_URL: postgresql://postgres:postgres_dev_pwd@localhost:5432/finanzas_db
        run: pnpm build
